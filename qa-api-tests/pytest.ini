[pytest]
addopts = -ra -q --strict-markers --html=reports/report.html --self-contained-html
testpaths = tests
markers =
    emision: puede generar un DTE real en QA (consume folio CAF)
    emision_happy: se espera que emita (200) y consuma folio
    duplicidad: pruebas de reenvio / idempotencia / concurrencia
    perf: pruebas de rendimiento (opt-in, correr con -m perf)
    seguridad: pruebas orientadas a seguridad de API
    app: canal App/POS (sin JWT segun doc)
    dummys: contrato de las APIs mock (solo corre con ENV=DUMMYS)
    nc: Nota de Credito tipo 61
    bloqueante: caso que puede quedar BLOCKED por dependencia externa
    posible_defecto: el comportamiento observado contradice el contrato documentado
    case_id: id del caso en la matriz de pruebas (docs/02_matriz_pruebas.md)
